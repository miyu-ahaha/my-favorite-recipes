<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my favorite recipes</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #faf7f2;
            color: #5c4c3e;
            font-family: 'Zen Maru Gothic', sans-serif;
            line-height: 1.6;
            -webkit-text-size-adjust: 100%;
        }

        .page {
            display: none;
            padding: 20px 16px 40px;
            max-width: 600px;
            margin: 0 auto;
        }

        .page.active {
            display: block;
        }

        header {
            position: relative;
            text-align: center;
            padding: 16px 0 16px;
        }

        /* 読込中のクルクル表示 */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(250, 247, 242, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            font-size: 0.95rem;
            color: #b07d62;
            font-weight: 700;
            gap: 10px;
            transition: opacity 0.3s ease;
        }
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e3d5ca;
            border-top: 4px solid #b07d62;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 右上の「＋」追加ボタン */
        .header-add-btn {
            position: absolute;
            right: 0;
            top: 20px;
            width: 38px;
            height: 38px;
            background-color: #b07d62;
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(176, 125, 98, 0.2);
            transition: background-color 0.2s, transform 0.2s;
            z-index: 10;
        }

        .header-add-btn:active {
            transform: scale(0.92);
            background-color: #9c6c53;
        }

        .site-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #b07d62;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
            padding-right: 40px;
            padding-left: 40px;
        }

        .site-subtitle {
            font-size: 0.85rem;
            color: #8c7a6b;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
            padding-right: 40px;
            padding-left: 40px;
        }

        .search-box {
            position: relative;
            max-width: 100%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            padding: 12px 45px 12px 20px;
            background-color: #fff;
            border: 1.5px solid #e3d5ca;
            border-radius: 30px;
            font-size: 0.95rem;
            color: #5c4c3e;
            outline: none;
            box-shadow: 0 2px 6px rgba(92, 76, 62, 0.04);
            font-family: 'Zen Maru Gothic', sans-serif;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #b07d62;
        }

        .search-input::placeholder {
            color: #bfa89b;
        }

        .clear-search-btn {
            position: absolute;
            right: 12px;
            background-color: #e8dcc4;
            border: none;
            color: #735e4c;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .clear-search-btn.show {
            display: flex;
        }

        .category-filter-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .category-filter-scroll::-webkit-scrollbar {
            display: none;
        }
        .cat-filter-btn {
            background-color: #fff;
            border: 1px solid #e3d5ca;
            color: #8c7a6b;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            font-family: 'Zen Maru Gothic', sans-serif;
            transition: all 0.2s;
        }
        .cat-filter-btn.active {
            background-color: #b07d62;
            color: #fff;
            border-color: #b07d62;
        }

        .post-box {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 0 20px;
            box-shadow: 0 4px 12px rgba(176, 125, 98, 0.08);
            margin-bottom: 24px;
            border: 1.5px dashed #e3d5ca;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.3s ease;
        }

        .post-box.open {
            padding: 20px;
            max-height: 4000px;
        }

        .post-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .bulk-paste-box {
            background-color: #fdfaf6;
            border: 1.5px solid #d4c2b4;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .bulk-paste-header {
            padding: 12px 14px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #b07d62;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            background-color: #f7f0e8;
            transition: background-color 0.2s;
        }

        .bulk-paste-header:hover {
            background-color: #f2e6dc;
        }

        .bulk-paste-header .bulk-toggle-icon {
            font-size: 0.9rem;
            transition: transform 0.3s ease;
        }

        .bulk-paste-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.3s ease;
            padding: 0 14px;
        }

        .bulk-paste-box.open .bulk-paste-content {
            max-height: 1000px;
            padding: 14px;
        }

        .bulk-paste-box.open .bulk-toggle-icon {
            transform: rotate(180deg);
        }

        .form-section-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #735e4c;
            border-bottom: 1px dashed #e3d5ca;
            padding-bottom: 4px;
            margin-top: 8px;
        }

        .post-input, .post-textarea {
            width: 100%;
            padding: 10px 14px;
            background-color: #fcfbfa;
            border: 1px solid #e3d5ca;
            border-radius: 10px;
            font-size: 0.9rem;
            color: #5c4c3e;
            outline: none;
            font-family: 'Zen Maru Gothic', sans-serif;
            transition: border-color 0.2s;
        }

        .post-input:focus, .post-textarea:focus {
            border-color: #b07d62;
            background-color: #fff;
        }

        .post-textarea {
            resize: vertical;
            height: 80px;
        }

        .dynamic-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .dynamic-row input {
            flex: 1;
        }

        .small-add-btn, .small-del-btn, .small-action-btn {
            background-color: #e3d5ca;
            color: #5c4c3e;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Zen Maru Gothic', sans-serif;
            transition: background-color 0.2s;
            flex-shrink: 0;
        }

        .small-add-btn:hover, .small-action-btn:hover {
            background-color: #d4c2b4;
        }

        .small-action-btn {
            background-color: #b07d62;
            color: #fff;
            width: 100%;
            margin-top: 10px;
            text-align: center;
        }
        .small-action-btn:hover {
            background-color: #9c6c53;
        }

        .chatgpt-link-btn {
            display: block;
            background-color: #fff;
            color: #10a37f;
            border: 1px solid #10a37f;
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Zen Maru Gothic', sans-serif;
            width: 100%;
            margin-top: 8px;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .chatgpt-link-btn:hover {
            background-color: #f0fdf4;
        }

        .small-del-btn {
            background-color: #f2dede;
            color: #a94442;
            padding: 0 12px;
        }

        .small-del-btn:hover {
            background-color: #ebcccc;
        }

        .file-upload-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background-color: #fcfbfa;
            border: 1.5px dashed #b07d62;
            border-radius: 10px;
            padding: 10px;
            font-size: 0.85rem;
            color: #b07d62;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .file-upload-label:hover {
            background-color: #f4eade;
        }

        .file-upload-input {
            display: none;
        }

        .file-name-display {
            font-size: 0.8rem;
            color: #8c7a6b;
            text-align: center;
            margin-top: -10px;
        }

        .post-btn {
            background-color: #b07d62;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: 'Zen Maru Gothic', sans-serif;
            text-align: center;
            margin-top: 10px;
        }

        .post-btn:hover {
            background-color: #9c6c53;
        }

        .post-btn:active {
            transform: scale(0.98);
        }

        .recipe-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .recipe-card {
            background-color: #ffffff;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(176, 125, 98, 0.06);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: row;
            align-items: center;
            border: 1px solid #f0e6df;
        }

        .recipe-card:active {
            transform: scale(0.98);
        }

        .card-img-area {
            width: 90px;
            height: 90px;
            background-color: #f4eee9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .card-img-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .card-content {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
            min-width: 0;
        }

        .card-tag {
            display: inline-block;
            font-size: 0.7rem;
            color: #b07d62;
            margin-bottom: 2px;
            font-weight: 500;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 700;
            color: #4a3b2c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #e3d5ca;
            color: #5c4c3e;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 20px;
            font-family: 'Zen Maru Gothic', sans-serif;
        }

        .detail-header {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(176, 125, 98, 0.08);
            margin-bottom: 20px;
        }

        .detail-img-area {
            width: 100%;
            height: 200px;
            background-color: #f4eee9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            position: relative;
            overflow: hidden;
        }

        .detail-img-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .detail-title-area {
            padding: 20px;
        }

        .detail-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #4a3b2c;
            margin-bottom: 8px;
        }

        .detail-comment {
            font-size: 0.9rem;
            color: #8c7a6b;
        }

        .detail-section {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 12px rgba(176, 125, 98, 0.08);
            margin-bottom: 20px;
        }

        .section-heading {
            font-size: 1rem;
            font-weight: 700;
            color: #b07d62;
            border-bottom: 2px dashed #f0e6df;
            padding-bottom: 8px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ingredients-list {
            list-style: none;
        }

        .ingredients-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f9f6f0;
            font-size: 0.95rem;
        }

        .ingredients-item:last-child {
            border-bottom: none;
        }

        .ingredient-name {
            color: #5c4c3e;
        }

        .ingredient-amount {
            color: #8c7a6b;
            font-weight: 500;
        }

        .steps-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .step-item {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .step-number {
            background-color: #e8dcc4;
            color: #735e4c;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .step-text {
            font-size: 0.95rem;
            color: #5c4c3e;
        }

        .detail-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .action-edit-btn {
            flex: 1;
            background-color: #e3d5ca;
            color: #5c4c3e;
            border: none;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Zen Maru Gothic', sans-serif;
            text-align: center;
        }
        .action-edit-btn:hover {
            background-color: #d4c2b4;
        }
        .action-delete-btn {
            flex: 1;
            background-color: #f2dede;
            color: #a94442;
            border: none;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Zen Maru Gothic', sans-serif;
            text-align: center;
        }
        .action-delete-btn:hover {
            background-color: #ebcccc;
        }
    </style>
</head>
<body>

    <!-- 読込中オーバーレイ -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <span>レシピを読み込んでいます...</span>
    </div>

    <div id="home-page" class="page active">
        <header>
            <button type="button" class="header-add-btn" onclick="togglePostBox()">+</button>
            <h1 class="site-title">my favorite recipes</h1>
            <p class="site-subtitle">きょうのごはん、なににする？</p>
            
            <div class="search-box">
                <input type="text" class="search-input" id="search-input" placeholder="料理名や材料で検索..." oninput="handleSearchInput()">
                <button type="button" class="clear-search-btn" id="clear-search-btn" onclick="clearSearchInput()" title="クリア">✕</button>
            </div>
            
            <div class="category-filter-scroll" id="category-filter-container">
                <button type="button" class="cat-filter-btn active" onclick="setCategoryFilter('すべて', this)">すべて</button>
                <button type="button" class="cat-filter-btn" onclick="setCategoryFilter('お肉料理', this)">お肉料理</button>
                <button type="button" class="cat-filter-btn" onclick="setCategoryFilter('魚料理', this)">魚料理</button>
                <button type="button" class="cat-filter-btn" onclick="setCategoryFilter('野菜料理', this)">野菜料理</button>
                <button type="button" class="cat-filter-btn" onclick="setCategoryFilter('副菜', this)">副菜</button>
                <button type="button" class="cat-filter-btn" onclick="setCategoryFilter('ごはん', this)">ごはん</button>
                <button type="button" class="cat-filter-btn" onclick="setCategoryFilter('麺', this)">麺</button>
                <button type="button" class="cat-filter-btn" onclick="setCategoryFilter('スープ', this)">スープ</button>
                <button type="button" class="cat-filter-btn" onclick="setCategoryFilter('おやつ', this)">おやつ</button>
            </div>
        </header>

        <div class="post-box" id="post-box">
            <div class="post-form">
                <input type="hidden" id="edit-index" value="">
                
                <div class="bulk-paste-box" id="bulk-paste-box">
                    <div class="bulk-paste-header" onclick="toggleBulkBox()">
                        <span>🪄 AIなどでレシピを一括読み込みする</span>
                        <span class="bulk-toggle-icon">▼</span>
                    </div>
                    <div class="bulk-paste-content">
                        <textarea class="post-textarea" id="bulk-input" placeholder="ここにレシピの文章を丸ごと貼り付けて、「一発反映」を押すと自動でフォームに振り分けられます！"></textarea>
                        <a href="#" id="chatgpt-link" class="chatgpt-link-btn" target="_blank" onclick="openChatGPTWithPrompt()">💬 ChatGPTを開いてプロンプトを自動入力する</a>
                        <button type="button" class="small-action-btn" onclick="parseBulkRecipe()">✨ フォームに一発反映する</button>
                    </div>
                </div>

                <div class="form-section-title" id="form-main-heading">新しいレシピを追加</div>
                <input type="text" class="post-input" id="new-title" placeholder="レシピのタイトル（例：特製ハンバーグ）">
                <input type="text" class="post-input" id="new-servings" placeholder="人数・分量（例：2人分）">
                <input type="text" class="post-input" id="new-tag" placeholder="カテゴリー（例：お肉料理、おやつ）">
                <textarea class="post-textarea" id="new-desc" placeholder="簡単な説明やコメント..."></textarea>
                
                <label class="file-upload-label" for="new-image">
                    📷 写真を選択する（任意）
                </label>
                <input type="file" id="new-image" class="file-upload-input" accept="image/*" onchange="updateFileName(this)">
                <div class="file-name-display" id="file-name-display">選択されていません</div>

                <div class="form-section-title">材料</div>
                <div id="ingredients-container">
                    <div class="dynamic-row ingredient-row">
                        <input type="text" class="post-input ing-name" placeholder="材料名（例：豚肉）">
                        <input type="text" class="post-input ing-amount" placeholder="分量（例：200g）">
                    </div>
                </div>
                <button type="button" class="small-add-btn" onclick="addIngredientRow()">＋ 材料を追加</button>

                <div class="form-section-title">作り方手順</div>
                <div id="steps-container">
                    <div class="dynamic-row step-row">
                        <input type="text" class="post-input step-text-input" placeholder="手順（例：一口大に切る）">
                    </div>
                </div>
                <button type="button" class="small-add-btn" onclick="addStepRow()">＋ 手順を追加</button>

                <button class="post-btn" id="submit-btn" onclick="saveRecipe()">リストに追加する</button>
                <button class="post-btn" id="cancel-edit-btn" onclick="resetForm()" style="background-color: #e3d5ca; color: #5c4c3e; display: none; margin-top: 6px;">編集をやめる</button>
            </div>
        </div>

        <main class="recipe-grid" id="recipe-grid">
        </main>
    </div>

    <div id="dynamic-detail-page" class="page">
        <button class="back-btn" onclick="goBackToHome()">← もどる</button>
        <div class="detail-header">
            <div class="detail-img-area" id="dyn-img-container">🍳</div>
            <div class="detail-title-area">
                <span class="card-tag" id="dyn-tag">カテゴリー</span>
                <h2 class="detail-title" id="dyn-title">タイトル</h2>
                <p class="detail-comment" id="dyn-desc">ここに説明が入ります。</p>
            </div>
        </div>
        <div class="detail-section">
            <h3 class="section-heading" id="dyn-ingredients-heading">📝 材料</h3>
            <ul class="ingredients-list" id="dyn-ingredients-list"></ul>
        </div>
        <div class="detail-section">
            <h3 class="section-heading">🍳 作り方</h3>
            <ol class="steps-list" id="dyn-steps-list"></ol>
        </div>

        <div class="detail-actions">
            <button class="action-edit-btn" id="dyn-edit-btn">✏️ このレシピを編集する</button>
            <button class="action-delete-btn" id="dyn-delete-btn" onclick="deleteCurrentRecipe()">🗑️ このレシピを削除する</button>
        </div>
    </div>

    <script>
        // ==========================================
        //  ローカル保存（localStorage）方式
        // ==========================================
        const STORAGE_KEY = 'my_favorite_recipes_data_v1';

        const defaultRecipes = [
            {
                id: 1,
                title: "甘辛しみしみ☆大根のべっこう煮",
                servings: "4人分",
                tag: "副菜",
                desc: "べっこう色の甘辛味♪しっかり味のしみた大根です。",
                imgSrc: null,
                ingredients: [
                    { name: "大根", amount: "400g" },
                    { name: "水（A）", amount: "3カップ" },
                    { name: "みりん（A）", amount: "大さじ2" },
                    { name: "砂糖（A）", amount: "大さじ1" },
                    { name: "「ほんだし®」（A）", amount: "小さじ1" },
                    { name: "しょうゆ", amount: "大さじ1・1/2" }
                ],
                steps: [
                    "大根は2cm厚さの半月切りにする。",
                    "鍋に大根とかぶるくらいの水を入れて煮立て、20分ほど下ゆでする。",
                    "別の鍋に大根と（A）を入れて煮立て、弱火にして落としぶたをして5分煮る。",
                    "しょうゆを加えて30分煮て火を止め、味がしみるまでおく。"
                ]
            }
        ];

        let recipes = [];
        let currentDetailId = null;
        let selectedCategory = 'すべて';

        window.onload = function() {
            loadRecipes();
            
            if (history.state && history.state.page === 'detail' && history.state.recipeId) {
                showDetail(history.state.recipeId, false);
            } else {
                showHome(false);
            }
            
            hideLoading();
        };

        function hideLoading() {
            document.getElementById('loading-overlay').classList.add('hidden');
        }

        function showLoading(text) {
            const overlay = document.getElementById('loading-overlay');
            overlay.querySelector('span').innerText = text || "読み込んでいます...";
            overlay.classList.remove('hidden');
        }

        function loadRecipes() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        recipes = parsed;
                        return;
                    }
                }
                recipes = defaultRecipes;
            } catch (err) {
                console.error(err);
                recipes = defaultRecipes;
            }
        }

        function saveRecipes() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes));
                return true;
            } catch (err) {
                console.error(err);
                alert('保存に失敗しました（容量がいっぱい等の可能性があります）。');
                return false;
            }
        }

        window.addEventListener('popstate', (event) => {
            if (event.state && event.state.page === 'detail') {
                if (event.state.recipeId) {
                    showDetail(event.state.recipeId, false);
                }
            } else {
                showHome(false);
            }
        });

        function togglePostBox() {
            const postBox = document.getElementById('post-box');
            postBox.classList.toggle('open');
            if (postBox.classList.contains('open')) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function toggleBulkBox() {
            const bulkBox = document.getElementById('bulk-paste-box');
            bulkBox.classList.toggle('open');
        }

        function showHome(pushHistory = true) {
            if (pushHistory) {
                history.pushState({ page: 'home' }, '', '');
            }
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));

            document.getElementById('home-page').classList.add('active');
            window.scrollTo(0, 0);
            filterAndRenderRecipes();
        }

        function goBackToHome() {
            history.back();
        }

        function setCategoryFilter(category, btnElement) {
            selectedCategory = category;
            const buttons = document.querySelectorAll('.cat-filter-btn');
            buttons.forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            filterAndRenderRecipes();
        }

        function handleSearchInput() {
            const input = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-search-btn');
            if (input.value.length > 0) {
                clearBtn.classList.add('show');
            } else {
                clearBtn.classList.remove('show');
            }
            filterAndRenderRecipes();
        }

        function clearSearchInput() {
            const input = document.getElementById('search-input');
            input.value = '';
            document.getElementById('clear-search-btn').classList.remove('show');
            filterAndRenderRecipes();
            input.focus();
        }

        function filterAndRenderRecipes() {
            const keyword = document.getElementById('search-input').value.toLowerCase();
            const filtered = recipes.filter(r => {
                const matchCategory = (selectedCategory === 'すべて') || (r.tag && r.tag.trim() === selectedCategory);
                const matchTitle = r.title.toLowerCase().includes(keyword);
                const matchDesc = r.desc.toLowerCase().includes(keyword);
                const matchTag = r.tag.toLowerCase().includes(keyword);
                const matchIng = r.ingredients && r.ingredients.some(i => i.name.toLowerCase().includes(keyword));
                return matchCategory && (matchTitle || matchDesc || matchTag || matchIng);
            });
            renderRecipeGrid(filtered);
        }

        function updateFileName(input) {
            const display = document.getElementById('file-name-display');
            if (input.files && input.files[0]) {
                display.innerText = '選択中: ' + input.files[0].name;
            } else {
                display.innerText = '選択されていません';
            }
        }

        function addIngredientRow(nameVal = '', amountVal = '') {
            const container = document.getElementById('ingredients-container');
            const row = document.createElement('div');
            row.className = 'dynamic-row ingredient-row';
            row.innerHTML = `
                <input type="text" class="post-input ing-name" placeholder="材料名" value="${nameVal}">
                <input type="text" class="post-input ing-amount" placeholder="分量" value="${amountVal}">
                <button type="button" class="small-del-btn" onclick="this.parentElement.remove()">✕</button>
            `;
            container.appendChild(row);
        }

        function addStepRow(textVal = '') {
            const container = document.getElementById('steps-container');
            const row = document.createElement('div');
            row.className = 'dynamic-row step-row';
            row.innerHTML = `
                <input type="text" class="post-input step-text-input" placeholder="手順" value="${textVal}">
                <button type="button" class="small-del-btn" onclick="this.parentElement.remove()">✕</button>
            `;
            container.appendChild(row);
        }

        function openChatGPTWithPrompt() {
            const promptText = `以下のレシピから、私が自作しているレシピアプリへ一括貼り付けするためのテキストを作ってください。
【出力ルール】
1. 1行目：レシピのタイトルのみ
2. 2行目：レシピの簡単な説明やコメント
3. 3行目で「材料（〇人分）」の形式で書いてください。
4. 4行目以降：各材料を "材料名 分量" の形で1行ずつ書いてください。
5. 作り方の手前で「作り方」とだけ1行書いてください。
6. その後、作り方の手順を数字や記号なしで1行ずつ順番に出力してください。

【対象のレシピ】
ここにレシピのURL、またはコピーしたテキストを貼り付けてください`;
            const chatGptUrl = 'https://chatgpt.com/?q=' + encodeURIComponent(promptText);
            document.getElementById('chatgpt-link').href = chatGptUrl;
        }

        function parseBulkRecipe() {
            const bulkText = document.getElementById('bulk-input').value.trim();
            if (!bulkText) {
                alert('一括貼り付け用のテキストを入力してください！');
                return;
            }
            const lines = bulkText.split('\n').map(l => l.trim()).filter(l => l !== '');
            let title = '', servings = '', desc = '';
            let ingredients = [], steps = [];
            let mode = 'title';

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                if (line.includes('材料') || line.includes('【材料】') || line.includes('材料：')) {
                    if (line.includes('（') || line.includes('(')) {
                        let match = line.match(/[（\(](.*?)[）\)]/);
                        if (match) servings = match[1];
                    }
                    mode = 'ingredients';
                    continue;
                } else if (line.includes('作り方') || line.includes('手順') || line.includes('【作り方】') || line.includes('作り方：')) {
                    mode = 'steps';
                    continue;
                }

                if (mode === 'title') {
                    title = line.replace(/^(タイトル[:：]?)\s*/, '');
                    mode = 'meta';
                } else if (mode === 'meta') {
                    desc = line;
                    mode = 'ingredients';
                } else if (mode === 'ingredients') {
                    let cleanLine = line.replace(/^[\*\-\•]\s*/, '').trim();
                    if (!cleanLine) continue;
                    let parts = cleanLine.split(/[\s　:-]+/);
                    if (parts.length >= 2) {
                        ingredients.push({ name: parts[0], amount: parts.slice(1).join(' ') });
                    } else {
                        ingredients.push({ name: cleanLine, amount: '適量' });
                    }
                } else if (mode === 'steps') {
                    let cleanStep = line.replace(/^[0-9０-９一二三四五六七八九十①②③④⑤⑥⑦⑧⑨⑩\.\s、）]+/g, '').trim();
                    steps.push(cleanStep || line);
                }
            }

            if (title) document.getElementById('new-title').value = title;
            if (servings) document.getElementById('new-servings').value = servings;
            if (desc) document.getElementById('new-desc').value = desc;

            const ingContainer = document.getElementById('ingredients-container');
            ingContainer.innerHTML = '';
            (ingredients.length > 0 ? ingredients : [{name:'', amount:''}]).forEach(item => addIngredientRow(item.name, item.amount));

            const stepContainer = document.getElementById('steps-container');
            stepContainer.innerHTML = '';
            (steps.length > 0 ? steps : ['']).forEach(st => addStepRow(st));

            document.getElementById('bulk-paste-box').classList.remove('open');
            document.getElementById('bulk-input').value = '';
            alert('✨ フォームに自動入力しました！');
        }

        function compressImage(file, maxWidth = 600, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function saveRecipe() {
            const titleInput = document.getElementById('new-title');
            const servingsInput = document.getElementById('new-servings');
            const tagInput = document.getElementById('new-tag');
            const descInput = document.getElementById('new-desc');
            const imageInput = document.getElementById('new-image');
            const editIndexInput = document.getElementById('edit-index');

            const title = titleInput.value.trim();
            if (!title) {
                alert('レシピのタイトルを入力してください！');
                return;
            }

            const servingsText = servingsInput.value.trim();
            const tagText = tagInput.value.trim() || 'お気に入り';
            const descText = descInput.value.trim() || '新しく追加したレシピです。';

            const ingredientRows = document.querySelectorAll('.ingredient-row');
            const ingredientsData = [];
            ingredientRows.forEach(row => {
                const name = row.querySelector('.ing-name').value.trim();
                const amount = row.querySelector('.ing-amount').value.trim();
                if (name) ingredientsData.push({ name: name, amount: amount || '適量' });
            });

            const stepRows = document.querySelectorAll('.step-row');
            const stepsData = [];
            stepRows.forEach(row => {
                const text = row.querySelector('.step-text-input').value.trim();
                if (text) stepsData.push(text);
            });

            const editId = editIndexInput.value;

            const processSave = (imgSrc) => {
                if (editId !== "") {
                    const index = recipes.findIndex(r => r.id == editId);
                    if (index !== -1) {
                        recipes[index].title = title;
                        recipes[index].servings = servingsText;
                        recipes[index].tag = tagText;
                        recipes[index].desc = descText;
                        if (imgSrc !== undefined) recipes[index].imgSrc = imgSrc;
                        recipes[index].ingredients = ingredientsData;
                        recipes[index].steps = stepsData;
                    }
                } else {
                    const newRecipe = {
                        id: Date.now(),
                        title: title,
                        servings: servingsText,
                        tag: tagText,
                        desc: descText,
                        imgSrc: imgSrc || null,
                        ingredients: ingredientsData,
                        steps: stepsData
                    };
                    recipes.unshift(newRecipe);
                }

                const success = saveRecipes();
                if (success) {
                    filterAndRenderRecipes();
                    resetForm();
                    document.getElementById('post-box').classList.remove('open');
                    alert('✨ レシピを保存しました！');
                }
            };

            const file = imageInput.files[0];
            if (file) {
                showLoading("画像を処理中...");
                const compressedDataUrl = await compressImage(file, 600, 0.7);
                hideLoading();
                processSave(compressedDataUrl);
            } else {
                let existingImg = undefined;
                if (editId !== "") {
                    const found = recipes.find(r => r.id == editId);
                    if (found) existingImg = found.imgSrc;
                }
                processSave(existingImg);
            }
        }

        function resetForm() {
            document.getElementById('new-title').value = '';
            document.getElementById('new-servings').value = '';
            document.getElementById('new-tag').value = '';
            document.getElementById('new-desc').value = '';
            document.getElementById('bulk-input').value = '';
            document.getElementById('new-image').value = '';
            document.getElementById('file-name-display').innerText = '選択されていません';
            document.getElementById('edit-index').value = '';
            
            document.getElementById('form-main-heading').innerText = '新しいレシピを追加';
            document.getElementById('submit-btn').innerText = 'リストに追加する';
            document.getElementById('cancel-edit-btn').style.display = 'none';

            document.getElementById('ingredients-container').innerHTML = `
                <div class="dynamic-row ingredient-row">
                    <input type="text" class="post-input ing-name" placeholder="材料名">
                    <input type="text" class="post-input ing-amount" placeholder="分量">
                </div>
            `;
            document.getElementById('steps-container').innerHTML = `
                <div class="dynamic-row step-row">
                    <input type="text" class="post-input step-text-input" placeholder="手順">
                </div>
            `;
        }

        function renderRecipeGrid(list) {
            const grid = document.getElementById('recipe-grid');
            grid.innerHTML = '';
            if (list.length === 0) {
                grid.innerHTML = '<p style="text-align:center; color:#8c7a6b; padding:20px;">該当するレシピがありません</p>';
                return;
            }
            list.forEach(recipe => {
                const card = document.createElement('div');
                card.className = 'recipe-card';
                const imgHtml = recipe.imgSrc 
                    ? `<div class="card-img-area"><img src="${recipe.imgSrc}" alt="${recipe.title}"></div>`
                    : `<div class="card-img-area">🍳</div>`;

                card.onclick = function() { showDetail(recipe.id, true); };
                card.innerHTML = `
                    ${imgHtml}
                    <div class="card-content">
                        <span class="card-tag">${recipe.tag || 'お気に入り'}</span>
                        <h2 class="card-title">${recipe.title}</h2>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function showDetail(recipeId, pushHistory = true) {
            if (pushHistory) {
                history.pushState({ page: 'detail', recipeId: recipeId }, '', '');
            }
            currentDetailId = recipeId;
            const recipe = recipes.find(r => r.id == recipeId);
            if (!recipe) return;

            document.getElementById('dyn-title').innerText = recipe.title;
            document.getElementById('dyn-tag').innerText = recipe.tag || 'お気に入り';
            document.getElementById('dyn-desc').innerText = recipe.desc;

            const dynIngHeading = document.getElementById('dyn-ingredients-heading');
            dynIngHeading.innerHTML = recipe.servings ? `📝 材料（${recipe.servings}）` : `📝 材料`;

            const dynImgContainer = document.getElementById('dyn-img-container');
            if (recipe.imgSrc) {
                dynImgContainer.innerHTML = `<img src="${recipe.imgSrc}" alt="${recipe.title}" style="width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0;">`;
            } else {
                dynImgContainer.innerHTML =  '🍳';
            }

            const ingListElem = document.getElementById('dyn-ingredients-list');
            ingListElem.innerHTML = '';
            if (recipe.ingredients && recipe.ingredients.length > 0) {
                recipe.ingredients.forEach(item => {
                    ingListElem.innerHTML += `
                        <li class="ingredients-item">
                            <span class="ingredient-name">${item.name}</span>
                            <span class="ingredient-amount">${item.amount}</span>
                        </li>
                    `;
                });
            } else {
                ingListElem.innerHTML = `<li class="ingredients-item"><span class="ingredient-name">特になし</span><span class="ingredient-amount">-</span></li>`;
            }

            const stepListElem = document.getElementById('dyn-steps-list');
            stepListElem.innerHTML = '';
            if (recipe.steps && recipe.steps.length > 0) {
                recipe.steps.forEach((stepText, index) => {
                    stepListElem.innerHTML += `
                        <li class="step-item">
                            <span class="step-number">${index + 1}</span>
                            <span class="step-text">${stepText}</span>
                        </li>
                    `;
                });
            } else {
                stepListElem.innerHTML = `<li class="step-item"><span class="step-number">1</span><span class="step-text">メモ特になし</span></li>`;
            }

            document.getElementById('dyn-edit-btn').onclick = function() { startEdit(recipe.id); };

            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));
            document.getElementById('dynamic-detail-page').classList.add('active');
            window.scrollTo(0, 0);
        }

        function deleteCurrentRecipe() {
            if (!currentDetailId) return;
            if (confirm('本当にこのレシピを削除しますか？')) {
                recipes = recipes.filter(r => r.id != currentDetailId);
                const success = saveRecipes();
                if (success) {
                    showHome(true);
                    alert('🗑️ レシピを削除しました。');
                }
            }
        }

        function startEdit(recipeId) {
            const recipe = recipes.find(r => r.id == recipeId);
            if (!recipe) return;

            document.getElementById('edit-index').value = recipe.id;
            document.getElementById('new-title').value = recipe.title;
            document.getElementById('new-servings').value = recipe.servings || '';
            document.getElementById('new-tag').value = recipe.tag || '';
            document.getElementById('new-desc').value = recipe.desc || '';

            const ingContainer = document.getElementById('ingredients-container');
            ingContainer.innerHTML = '';
            if (recipe.ingredients && recipe.ingredients.length > 0) {
                recipe.ingredients.forEach(i => addIngredientRow(i.name, i.amount));
            } else {
                addIngredientRow();
            }

            const stepContainer = document.getElementById('steps-container');
            stepContainer.innerHTML = '';
            if (recipe.steps && recipe.steps.length > 0) {
                recipe.steps.forEach(s => addStepRow(s));
            } else {
                addStepRow();
            }

            document.getElementById('form-main-heading').innerText = 'レシピを編集';
            document.getElementById('submit-btn').innerText = '変更を保存する';
            document.getElementById('cancel-edit-btn').style.display = 'block';

            showHome(true);
            document.getElementById('post-box').classList.add('open');
            window.scrollTo(0, 0);
        }
    </script>
